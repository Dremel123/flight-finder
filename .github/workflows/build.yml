# Builds Flight Finder on Windows, macOS and Linux (PyInstaller can't cross-build), checks each app starts,
# and uploads the installers. Run it from the Actions tab ("Run workflow"); pushing a tag like v1.0.1 also publishes a release.
name: Build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # to publish releases on tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]  # macos-latest = Apple Silicon; ubuntu-22.04 = older glibc, runs on more distros
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libdbus-1-3 libfontconfig1
      - name: Build and smoke test
        run: python build.py
        env:
          BUILD_DIR: ${{ runner.temp }}/ffbuild
      - uses: actions/upload-artifact@v4
        with:
          name: flight-finder-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The three OS jobs share one release: whichever finishes first creates it
          gh release create "$GITHUB_REF_NAME" --title "Flight Finder $GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
